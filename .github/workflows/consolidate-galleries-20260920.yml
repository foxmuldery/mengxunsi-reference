name: Consolidate approved project galleries 20260920
on:
  push:
    branches: [integration/project-galleries-20260920]
    paths: [.github/workflows/consolidate-galleries-20260920.yml]
permissions:
  contents: write
concurrency:
  group: consolidate-galleries-20260920
  cancel-in-progress: false
jobs:
  consolidate:
    if: github.repository_owner == 'foxmuldery'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Fetch the approved branch without executing repository scripts
        shell: bash
        run: |
          set -euo pipefail
          git init work
          cd work
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" fetch --no-tags origin "$GITHUB_SHA"
          git checkout -b "$GITHUB_REF_NAME" FETCH_HEAD
          git config user.name 'Project gallery consolidation'
          git config user.email '129568211+foxmuldery@users.noreply.github.com'
      - name: Import complete source trees and preserve source commit ancestry
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, os, json, html, pathlib, datetime
          from urllib.parse import quote
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          groups = {
            'mengxunsi-reference': ('梦巡司', [('061','characters','角色造型','mengxunsi-characters'),('062','reference','视觉参考','mengxunsi-reference')]),
            'bencao-qitan-characters': ('本草奇探', [('010','characters','角色造型','bencao-qitan-characters'),('011','facebible','面部设定','bencao-qitan-facebible'),('012','monsters','怪物','bencao-qitan-monsters'),('013','props','道具','bencao-qitan-props'),('014','reference','视觉参考','bencao-qitan-reference'),('015','scenes','场景','bencao-qitan-scenes')]),
            'shikong-scenes': ('失控游戏', [('069','characters','角色造型','shikong-game-characters'),('070','reference','视觉参考','shikong-game-reference'),('071','ghost-train','幽灵列车','shikong-ghost-train'),('072','props','道具','shikong-props'),('073','scenes','场景','shikong-scenes'),('074','storyboard','分镜','shikong-storyboard'),('075','voice','音色比较','shikong-voice-compare')]),
            'huzu-scenes': ('狐祖归来', [('038','props','道具','huzu-props'),('039','scene-explore','场景探索','huzu-scene-explore'),('040','scene-pick','场景挑选','huzu-scene-pick'),('041','scenes','场景','huzu-scenes'),('042','storyboard','分镜','huzu-storyboard'),('043','style-compare','风格比较','huzu-style-compare'),('044','characters','角色造型','huzu-xueniang')])
          }
          repo = os.environ['GITHUB_REPOSITORY'].split('/')[1]
          title, members = groups[repo]
          if git('status','--porcelain'): raise SystemExit('Dirty worktree')
          if pathlib.Path('project').exists() or pathlib.Path('collections').exists(): raise SystemExit('Destination exists; refusing overwrite')
          sources=[]
          for number, slug, label, source in members:
              git('fetch','--no-tags','https://github.com/foxmuldery/'+source+'.git','refs/heads/main')
              sha=git('rev-parse','FETCH_HEAD')
              tree=git('rev-parse',sha+'^{tree}')
              entries=git('ls-tree','-r','-z',sha).split('\0')
              entries=[x for x in entries if x]
              if any(x.startswith('160000 ') for x in entries): raise SystemExit('Submodule requires separate review: '+source)
              for entry in entries:
                  metadata,path=entry.split('\t',1)
                  if metadata.startswith('120000 '): raise SystemExit('Symlink requires separate review: '+source+'/'+path)
                  if path in ['.env','.env.local'] or path.endswith(('.pem','.key')): raise SystemExit('Sensitive-looking path requires review: '+source+'/'+path)
              sources.append(dict(number=number,slug=slug,label=label,repository='foxmuldery/'+source,commit=sha,tree=tree,files=len(entries)))
          for source in sources:
              prefix='collections/'+source['slug']+'/'
              git('read-tree','--prefix='+prefix,'-u',source['tree'])
              tree=git('write-tree'); head=git('rev-parse','HEAD')
              parents=['-p',head]
              if subprocess.run(['git','merge-base','--is-ancestor',source['commit'],head],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode: parents += ['-p',source['commit']]
              commit=git('commit-tree',tree,*parents,'-m','Import '+source['repository']+' at '+source['commit']+' under '+prefix)
              git('reset','--hard',commit)
              actual=git('rev-parse','HEAD:'+prefix.rstrip('/'))
              if actual != source['tree']: raise SystemExit('Tree hash mismatch: '+source['repository'])
              source['verified_tree']=actual
              source['entry_exists']=pathlib.Path(prefix+'index.html').is_file()
          root=pathlib.Path('project'); root.mkdir()
          report=dict(project=title,target=os.environ['GITHUB_REPOSITORY'],status='complete-source-trees-verified',sources=sources,original_repositories_modified=False,old_homepage_modified=False,scope='Default-branch Git histories and exact file trees; no external databases, browser storage, Releases, or LFS hydration claimed')
          (root/'sources.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          cards=''.join('<article><small>'+s['number']+'</small><h2>'+html.escape(s['label'])+'</h2><p>'+str(s['files'])+' 个文件 · 已核对目录哈希</p><a href="../collections/'+s['slug']+'/index.html">打开分类</a><p><a href="https://github.com/'+s['repository']+'/tree/'+s['commit']+'">原始版本 '+s['commit'][:8]+'</a></p></article>' for s in sources if s['entry_exists'])
          (root/'index.html').write_text('<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+title+' · 项目资料库</title><style>body{font:16px/1.7 system-ui;margin:auto;max-width:1100px;padding:40px 24px;background:#f4f2ec;color:#232726}h1{font-size:32px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}article{background:white;border:1px solid #d9d7d0;border-radius:10px;padding:22px}a{color:#245b4b}small{font-family:monospace}footer{margin-top:32px}</style><header><p>兔狲 · 项目资料库</p><h1>'+title+'</h1><p>各分类的网页与素材已原样收拢。旧首页与原仓库保持不变。</p></header><main>'+cards+'</main><footer><a href="../index.html">原首页</a> · <a href="sources.json">来源与哈希核对清单</a><p>本次整合不包含浏览器本地选择记录、外部数据库或发布附件；未对旧页面作功能改写。</p></footer></html>')
          pathlib.Path('CONSOLIDATION_20260920.md').write_text('# '+title+' 项目整合\n\n统一入口：`project/index.html`。分类文件位于 `collections/`，按源仓独立目录保存。原根目录与首页未覆盖。每个目录的 Git tree 哈希与锁定源版本一致，来源见 `project/sources.json`。\n\n原仓库没有删除或归档。源默认分支的提交祖先保留在本合并分支中；其他分支、标签、Release、外部存储与浏览器记录仍须单独备份。不能仅凭本次整合删除源仓。\n')
          git('add','project','CONSOLIDATION_20260920.md')
          git('commit','-m','Add unified project entry and verified source inventory')
          print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Publish only the integration branch, never force-push
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
